services:
  - type: web
    name: fyp-groq
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: GROQ_API_KEY
        sync: false
