<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      overflow: hidden;
      font-family: Segoe UI, Arial, sans-serif;
    }

    #three-root {
      position: absolute;
      inset: 0;
      display: block;
    }

    #fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="three-root"></div>
  <div id="fallback">Unable to load 3D model. Check network access to model URL.</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from './vendor/three/OrbitControls.module.js';

    const params = new URLSearchParams(window.location.search);
    const model = params.get('model');
    const fallback = document.getElementById('fallback');
    const threeRoot = document.getElementById('three-root');

    function makeToothMesh(type) {
      const enamel = new THREE.MeshPhysicalMaterial({
        color: 0xf4efe2,
        roughness: 0.34,
        metalness: 0.0,
        clearcoat: 0.35,
        clearcoatRoughness: 0.28
      });

      const dentin = new THREE.MeshStandardMaterial({
        color: 0xcaa96a,
        roughness: 0.55,
        metalness: 0.0
      });

      const group = new THREE.Group();

      // Crown bulk (molar-like) with cusp bumps.
      const crownCore = new THREE.Mesh(new THREE.SphereGeometry(0.58, 64, 48), enamel);
      crownCore.scale.set(1.05, 0.85, 1.0);
      crownCore.position.set(0, 0.62, 0);
      group.add(crownCore);

      const cuspPositions = [
        [-0.22, 0.93, -0.18],
        [0.23, 0.94, -0.17],
        [-0.19, 0.90, 0.20],
        [0.18, 0.89, 0.18]
      ];
      for (const p of cuspPositions) {
        const cusp = new THREE.Mesh(new THREE.SphereGeometry(0.20, 36, 24), enamel);
        cusp.position.set(p[0], p[1], p[2]);
        cusp.scale.set(1.0, 0.75, 1.0);
        group.add(cusp);
      }

      // Cervical transition to roots.
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.48, 0.36, 42), enamel);
      neck.position.set(0, 0.10, 0);
      group.add(neck);

      // Two roots for molar look.
      const rootLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.24, 1.35, 40), dentin);
      rootLeft.position.set(-0.22, -0.78, -0.02);
      rootLeft.rotation.z = 0.13;
      rootLeft.rotation.x = -0.04;
      group.add(rootLeft);

      const rootRight = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.23, 1.30, 40), dentin);
      rootRight.position.set(0.24, -0.75, 0.03);
      rootRight.rotation.z = -0.10;
      rootRight.rotation.x = 0.03;
      group.add(rootRight);

      // Root fusion shoulder near CEJ.
      const furcation = new THREE.Mesh(new THREE.SphereGeometry(0.26, 40, 28), dentin);
      furcation.position.set(0.02, -0.22, 0.0);
      furcation.scale.set(1.3, 0.75, 1.0);
      group.add(furcation);

      addLesion(group, type);
      return group;
    }

    function addLesion(group, type) {
      if (type === 'occlusal_cavity') {
        const darkCavity = new THREE.Mesh(
          new THREE.SphereGeometry(0.20, 36, 24),
          new THREE.MeshStandardMaterial({ color: 0x1f140d, roughness: 0.92, metalness: 0.0 })
        );
        darkCavity.position.set(0.02, 1.03, -0.02);
        darkCavity.scale.set(1.35, 0.42, 1.2);
        group.add(darkCavity);

        const cavityRim = new THREE.Mesh(
          new THREE.TorusGeometry(0.22, 0.04, 18, 42),
          new THREE.MeshStandardMaterial({ color: 0x7b5a39, roughness: 0.78, metalness: 0.0 })
        );
        cavityRim.position.set(0.02, 1.02, -0.01);
        cavityRim.rotation.x = Math.PI / 2.1;
        group.add(cavityRim);
      }

      if (type === 'root_caries') {
        const lesion = new THREE.Mesh(
          new THREE.SphereGeometry(0.18, 24, 24),
          new THREE.MeshStandardMaterial({ color: 0x4a2a1b, roughness: 0.95, metalness: 0.0 })
        );
        lesion.position.set(0.39, -0.02, 0.09);
        lesion.scale.set(1.2, 0.75, 0.95);
        group.add(lesion);
      }

      if (type === 'periapical_infection') {
        const glow = new THREE.Mesh(
          new THREE.SphereGeometry(0.20, 24, 24),
          new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.5, metalness: 0.0, emissive: 0x7f1d1d, emissiveIntensity: 0.7 })
        );
        glow.position.set(-0.03, -1.52, 0.01);
        glow.scale.set(1.1, 0.8, 1.2);
        group.add(glow);
      }
    }

    function renderDiseaseTooth(type) {
      if (!THREE || !OrbitControls) {
        threeRoot.style.display = 'none';
        fallback.style.display = 'flex';
        fallback.textContent = '3D engine failed to initialize.';
        return;
      }

      fallback.style.display = 'none';
      threeRoot.style.display = 'block';

      const scene = new THREE.Scene();
      scene.background = null;

      const width = Math.max(1, threeRoot.clientWidth);
      const height = Math.max(1, threeRoot.clientHeight);
      const camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 100);
      camera.position.set(1.95, 1.22, 2.25);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(width, height);
      threeRoot.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.minDistance = 1.1;
      controls.maxDistance = 4.0;
      controls.target.set(0.0, -0.10, 0.0);

      const key = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xbdd7ff, 0.8);
      rim.position.set(-3, 4, 3);
      scene.add(rim);
      const fill = new THREE.DirectionalLight(0xffffff, 0.7);
      fill.position.set(2, 2, 2);
      scene.add(fill);
      const warm = new THREE.DirectionalLight(0xfff2d9, 0.35);
      warm.position.set(0, 1, 4);
      scene.add(warm);

      const group = makeToothMesh(type);
      group.position.y = -0.03;
      scene.add(group);

      function onResize() {
        const nextWidth = Math.max(1, threeRoot.clientWidth);
        const nextHeight = Math.max(1, threeRoot.clientHeight);
        camera.aspect = nextWidth / nextHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(nextWidth, nextHeight);
      }
      window.addEventListener('resize', onResize);

      function animate() {
        requestAnimationFrame(animate);
        group.rotation.y += 0.0036;
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    if (!model || !model.startsWith('disease:')) {
      threeRoot.style.display = 'none';
      fallback.style.display = 'flex';
      fallback.textContent = 'Invalid disease model key.';
      return;
    }

    renderDiseaseTooth(model.replace('disease:', ''));
  </script>
</body>
</html>
