<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PalPath">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PalPath</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --brand-primary: #4A90E2;
      --brand-secondary: #357ABD;
      --bg: #f5f8ff;
      --text: #0f2a5f;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 20%, #ffffff 0%, var(--bg) 55%, #edf4ff 100%);
      opacity: 1;
      transition: opacity 380ms ease;
      z-index: 9999;
    }

    #app-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .loader-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 4px solid rgba(74, 144, 226, 0.2);
      border-top-color: var(--brand-primary);
      border-right-color: var(--brand-secondary);
      animation: spin 900ms linear infinite;
    }

    .loader-text {
      font-size: 14px;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Firebase Configuration for Web -->
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyA0Iq3I5oaCmGjesX75r3Q_SHOhEA8YSqY",
      authDomain: "dental-care-6daf8.firebaseapp.com",
      projectId: "dental-care-6daf8",
      storageBucket: "dental-care-6daf8.firebasestorage.app",
      messagingSenderId: "1073333582888",
      appId: "1:1073333582888:web:8166baf5019224f243491d",
      measurementId: "G-04DZKJFC3B"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Make Firebase available globally
    window.firebaseApp = app;
    window.firebaseAuth = auth;
    window.firebaseFirestore = db;
    window.firebaseStorage = storage;
  </script>
</head>
<body>
  <div id="app-loader" aria-live="polite" aria-busy="true">
    <div class="loader-wrap">
      <div class="loader-ring"></div>
      <div class="loader-text">Loading PalPath…</div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('app-loader');
      if (!loader) return;
      loader.classList.add('fade-out');
      setTimeout(() => loader.remove(), 420);
    });
  </script>
</body>
</html>
