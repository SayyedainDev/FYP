name: Deploy to Firebase Hosting on Push

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.13.6 (manual)
        run: |
          set -e
          FLUTTER_VERSION=3.13.6
          TAR=flutter_linux_${FLUTTER_VERSION}-stable.tar.xz
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${TAR}"
          echo "Downloading Flutter ${FLUTTER_VERSION} from ${URL}"
          wget -q "${URL}" -O ${TAR}
          tar xf ${TAR}
          mv flutter /home/runner/flutter_sdk
          echo "/home/runner/flutter_sdk/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=/home/runner/flutter_sdk" >> $GITHUB_ENV
          flutter --version
          dart --version || true
      - name: Precache Flutter SDK
        run: |
          flutter precache
          flutter doctor -v || true

      - name: Build Flutter Web
        run: |
          cd dental_care
          flutter pub get
          flutter build web --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install firebase-tools
        run: |
          npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN secret is missing. Add it in repo Settings → Secrets." && exit 1
          fi
          cd dental_care
          firebase deploy --only hosting --token "$FIREBASE_TOKEN"
